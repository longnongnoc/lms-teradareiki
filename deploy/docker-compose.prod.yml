name: lms

x-lms-image: &lms_image
  image: ${LMS_IMAGE:?LMS_IMAGE is required}
  platform: linux/amd64
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *lms_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    mem_limit: 440m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=256M
      - --max-connections=60
      - --performance-schema=OFF
      - --key-buffer-size=8M
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --table-open-cache=400
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: 1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    mem_limit: 80m
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    mem_limit: 80m
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *backend_defaults
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: on-failure

  create-site:
    <<: *backend_defaults
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -e
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        if [ ! -d "sites/${DOMAIN}" ]; then
          bench new-site --mariadb-user-host-login-scope='%' --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" --admin-password="$$ADMIN_PASSWORD" --install-app payments --install-app lms --set-default "${DOMAIN}"
        else
          echo "Site ${DOMAIN} already exists, checking installed apps"
          installed=$$(bench --site "${DOMAIN}" list-apps)
          for app in payments lms; do
            if ! echo "$$installed" | grep -Eq "^$$app([[:space:]]|$$)"; then
              echo "Installing missing app $$app"
              bench --site "${DOMAIN}" install-app "$$app"
            fi
          done
        fi
        bench --site "${DOMAIN}" enable-scheduler || echo "WARNING: could not enable scheduler"
        bench --site "${DOMAIN}" execute frappe.db.set_single_value --args "['System Settings','time_zone','Asia/Tokyo']" || echo "WARNING: could not set time zone"
        exit 0
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  backend:
    <<: *backend_defaults
    mem_limit: 400m
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  websocket:
    <<: *backend_defaults
    mem_limit: 120m
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js

  queue:
    <<: *backend_defaults
    mem_limit: 280m
    command: bench worker --queue short,default,long

  scheduler:
    <<: *backend_defaults
    mem_limit: 140m
    command: bench schedule

  frontend:
    <<: *lms_image
    mem_limit: 64m
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: "8080"
      FRAPPE_SITE_NAME_HEADER: ${DOMAIN:?DOMAIN is required}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 48m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
  caddy_data:
  caddy_config:
