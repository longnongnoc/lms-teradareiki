name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10"
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - name: Validate root module
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate bootstrap module
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    needs: fmt-validate
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10"
      - name: Init
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=terada-lms/terraform.tfstate" \
            -backend-config="region=$AWS_DEFAULT_REGION" \
            -backend-config="use_lockfile=true"
      - name: Plan
        working-directory: infra/terraform
        run: terraform plan -input=false -lock-timeout=60s

  apply:
    needs: fmt-validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10"
      - name: Init
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=terada-lms/terraform.tfstate" \
            -backend-config="region=$AWS_DEFAULT_REGION" \
            -backend-config="use_lockfile=true"
      - name: Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve -input=false -lock-timeout=60s
