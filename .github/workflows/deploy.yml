name: Deploy LMS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch or tag to deploy (empty = the branch this run was started on)
        required: false
        default: ""
      image_tag:
        description: LMS image tag to deploy, e.g. sha-1a2b3c4 (required; the Build LMS image summary lists the tag of each build)
        required: true
        default: ""
  push:
    branches: [main]
    paths:
      - "deploy/**"
  workflow_run:
    workflows: ["Build LMS image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    # Only builds from a push to main deploy automatically; a dispatched build can
    # build another lms_ref but still tags sha-<main sha>, so it must not deploy itself.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Concurrency is at job level so a skipped run (failed or dispatched build) does
    # not enter the group and replace a pending deploy.
    concurrency:
      group: deploy-lms
      cancel-in-progress: false
    steps:
      - name: Resolve ref and image tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_run)
              # The image the triggering build pushed, from the commit it built.
              ref="$RUN_HEAD_BRANCH"
              tag="sha-${RUN_HEAD_SHA::7}"
              source="Build LMS image run on $RUN_HEAD_SHA"
              ;;
            workflow_dispatch)
              ref="${INPUT_REF:-$GITHUB_REF_NAME}"
              tag="$INPUT_IMAGE_TAG"
              source="manual dispatch"
              if [[ -z "$tag" ]]; then
                echo "::error::image_tag is required. An empty tag would redeploy the image pinned in /opt/lms/.env and still report success. Pass the sha-<7char> tag from the Build LMS image run you want to deploy." >&2
                exit 1
              fi
              ;;
            push)
              # deploy/** changed: apply the new deploy files with the image already pinned in /opt/lms/.env.
              ref="$GITHUB_REF_NAME"
              tag=""
              source="push to deploy/**"
              ;;
            *)
              echo "Unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac
          safe='^[A-Za-z0-9._/][A-Za-z0-9._/-]*$'
          if ! [[ "$ref" =~ $safe ]]; then
            echo "Invalid ref" >&2
            exit 1
          fi
          if [[ -n "$tag" ]] && ! [[ "$tag" =~ ^[A-Za-z0-9._][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          echo "DEPLOY_REF=$ref" >> "$GITHUB_ENV"
          echo "DEPLOY_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          {
            echo "### Deploy LMS"
            echo
            echo "- Trigger: $source"
            echo "- Ref: \`$ref\`"
            if [[ -n "$tag" ]]; then
              echo "- Image tag: \`$tag\`"
            else
              echo "- Image tag: unchanged (the one pinned in \`/opt/lms/.env\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the image exists
        if: env.DEPLOY_IMAGE_TAG != ''
        run: |
          set -euo pipefail
          # deploy.sh writes the tag into /opt/lms/.env before pulling, so a missing tag would
          # leave .env pointing at an image that does not exist. Check anonymously, the way the
          # instance pulls (the GHCR package is public).
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/terada-lms:${DEPLOY_IMAGE_TAG}"
          if ! docker manifest inspect "$image" > /dev/null; then
            echo "::error::$image not found in GHCR" >&2
            exit 1
          fi
          echo "Found $image"

      - name: Find instance
        run: |
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=terada-lms" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [[ -z "$ids" || "$ids" == *[[:space:]]* ]]; then
            echo "Expected exactly one running instance tagged Project=terada-lms, got: '$ids'" >&2
            exit 1
          fi
          echo "INSTANCE_ID=$ids" >> "$GITHUB_ENV"

      - name: Run deploy through SSM
        run: |
          cmd="/opt/lms-repo/deploy/scripts/deploy.sh $DEPLOY_REF"
          if [[ -n "$DEPLOY_IMAGE_TAG" ]]; then
            cmd="$cmd $DEPLOY_IMAGE_TAG"
          fi
          echo "Sending: $cmd"
          params=$(jq -nc --arg c "$cmd" '{commands: [$c], executionTimeout: ["1800"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy LMS $DEPLOY_REF ${DEPLOY_IMAGE_TAG:-pinned image}" \
            --timeout-seconds 1800 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "Command id: $command_id"

          status=Pending
          for _ in $(seq 1 240); do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "Status: $status"
            case "$status" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
          done

          out=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true)
          err=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          echo "---- stdout (tail) ----"
          printf '%s\n' "$out" | tail -n 120
          echo "---- stderr (tail) ----"
          printf '%s\n' "$err" | tail -n 60

          if [[ "$status" != "Success" ]]; then
            echo "Deploy finished with status: $status" >&2
            exit 1
          fi
