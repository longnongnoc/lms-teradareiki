name: Deploy LMS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch or tag to deploy (empty = the branch this run was started on)
        required: false
        default: ""
      image_tag:
        description: Optional LMS image tag to deploy
        required: false
        default: ""
  push:
    branches: [develop]
    paths:
      - "deploy/**"

concurrency:
  group: deploy-lms
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
      DEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Validate inputs
        run: |
          safe='^[A-Za-z0-9._/][A-Za-z0-9._/-]*$'
          if ! [[ "$DEPLOY_REF" =~ $safe ]]; then
            echo "Invalid ref" >&2
            exit 1
          fi
          if [[ -n "$DEPLOY_IMAGE_TAG" ]] && ! [[ "$DEPLOY_IMAGE_TAG" =~ $safe ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi

      - name: Find instance
        run: |
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=terada-lms" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [[ -z "$ids" || "$ids" == *[[:space:]]* ]]; then
            echo "Expected exactly one running instance tagged Project=terada-lms, got: '$ids'" >&2
            exit 1
          fi
          echo "INSTANCE_ID=$ids" >> "$GITHUB_ENV"

      - name: Run deploy through SSM
        run: |
          cmd="/opt/lms-repo/deploy/scripts/deploy.sh $DEPLOY_REF"
          if [[ -n "$DEPLOY_IMAGE_TAG" ]]; then
            cmd="$cmd $DEPLOY_IMAGE_TAG"
          fi
          echo "Sending: $cmd"
          params=$(jq -nc --arg c "$cmd" '{commands: [$c], executionTimeout: ["1800"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy LMS $GITHUB_SHA" \
            --timeout-seconds 1800 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "Command id: $command_id"

          status=Pending
          for _ in $(seq 1 240); do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "Status: $status"
            case "$status" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
          done

          out=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true)
          err=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          echo "---- stdout (tail) ----"
          printf '%s\n' "$out" | tail -n 120
          echo "---- stderr (tail) ----"
          printf '%s\n' "$err" | tail -n 60

          if [[ "$status" != "Success" ]]; then
            echo "Deploy finished with status: $status" >&2
            exit 1
          fi
