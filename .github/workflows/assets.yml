name: Pre-build assets

on:
  push:
    branches: [develop, main]

jobs:
  assets:
    name: Pre-build assets
    uses: frappe/pilot/.github/workflows/app-assets.yml@develop
    with:
      # The frontend imports DataImportWizard and useDataImport from @framework/ui, which exist
      # only on Frappe develop; the build fails on version-16.
      frappe-branch: develop
    permissions:
      contents: write
